<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klausur-Werkzeuge</title>
<link rel="icon" href="data:,">
<style>
/* Farben als Variablen. Hell und dunkel. Keine externen Dateien: läuft ohne Internet. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1c1f24; --muted: #5d6673;
  --border: #dde1e6; --accent: #2f5bd3; --accent-soft: #e6ecfb; --accent-text: #ffffff;
  --ok: #1d7a46; --ok-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fff3dc;
  --err: #b42318; --err-soft: #fdecea; --info: #3d4a5c; --info-soft: #eef1f5;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --fs-out: 15px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --panel-2: #222730; --text: #e6e9ee; --muted: #9aa4b2;
    --border: #2e3440; --accent: #7aa2ff; --accent-soft: #1f2a44; --accent-text: #0d1220;
    --ok: #5fd08f; --ok-soft: #16301f; --warn: #f3b650; --warn-soft: #33270f;
    --err: #ff7b72; --err-soft: #3a1714; --info: #c2cad6; --info-soft: #232a35;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --panel-2: #222730; --text: #e6e9ee; --muted: #9aa4b2;
  --border: #2e3440; --accent: #7aa2ff; --accent-soft: #1f2a44; --accent-text: #0d1220;
  --ok: #5fd08f; --ok-soft: #16301f; --warn: #f3b650; --warn-soft: #33270f;
  --err: #ff7b72; --err-soft: #3a1714; --info: #c2cad6; --info-soft: #232a35;
  --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

header.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
}
header.top h1 { font-size: 17px; margin: 0; font-weight: 650; white-space: nowrap; }
header.top h1 span { color: var(--muted); font-weight: 400; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--muted);
}
nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.iconbtn {
  border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 4px 10px; cursor: pointer;
}
.iconbtn:hover { background: var(--panel-2); }

.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 53px); }
aside.side { border-right: 1px solid var(--border); background: var(--panel); padding: 14px 10px; position: sticky; top: 53px; height: calc(100vh - 53px); overflow: auto; }
aside.side input[type=search] {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 10px;
}
aside.side ol { list-style: none; margin: 0; padding: 0; }
aside.side li button {
  display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 7px 10px; border-radius: 8px; cursor: pointer;
}
aside.side li button:hover { background: var(--panel-2); }
aside.side li button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
aside.side .nr { color: var(--muted); font-variant-numeric: tabular-nums; width: 1.4em; text-align: right; font-size: 13px; }
aside.side .hint { color: var(--muted); font-size: 12.5px; padding: 10px; }

main { padding: 24px 28px 60px; max-width: 1180px; width: 100%; }
.titel h2 { margin: 0 0 4px; font-size: 24px; }
.titel .modul { font-family: var(--mono); color: var(--muted); font-size: 13px; }
.titel p { margin: 8px 0 0; color: var(--muted); max-width: 80ch; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.form-card { padding: 18px 20px; margin-top: 18px; }
.form-card h3, .out-card > h3 { margin: 0 0 12px; font-size: 15px; }
.felder { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px 18px; }
.feld label.name { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.feld label.name code { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
.feld .pflicht { color: var(--err); margin-left: 2px; }
.feld input[type=text], .feld select, .feld textarea, .frei input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  font-family: var(--mono); font-size: 14px;
}
.feld textarea { min-height: 64px; resize: vertical; }
.feld input:focus, .feld select:focus, .feld textarea:focus, .frei input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.feld .hilfe { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.feld.schalter { display: flex; gap: 10px; align-items: flex-start; }
.feld.schalter input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); }
.feld.schalter label.name { margin: 0; }
.sub-wahl { margin-bottom: 14px; }
.sub-wahl select { max-width: 420px; }

.aktionen { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.aktionen .kbd { color: var(--muted); font-size: 12.5px; }

details.beispiele { margin-top: 16px; }
details.beispiele summary { cursor: pointer; color: var(--accent); font-size: 14px; }
.bsp-liste { display: grid; gap: 6px; margin-top: 10px; }
.bsp { display: flex; gap: 10px; align-items: baseline; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; background: var(--bg); cursor: pointer; text-align: left; }
.bsp:hover { border-color: var(--accent); }
.bsp code { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.bsp .kom { color: var(--muted); font-size: 12.5px; margin-left: auto; white-space: nowrap; }
.frei { display: flex; gap: 8px; margin-top: 12px; }
.frei span { font-family: var(--mono); color: var(--muted); align-self: center; white-space: nowrap; font-size: 13px; }

/* Ausgabe */
.out-card { margin-top: 18px; padding: 18px 20px; scroll-margin-top: 70px; }
.befehl { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 13px; background: var(--panel-2); padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
.befehl code { white-space: pre; flex: 1; }
.zusammenfassung { margin: 14px 0 4px; border-left: 4px solid var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 10px 14px; }
.zusammenfassung h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ok); }
.zusammenfassung ul { margin: 0; padding-left: 18px; font-family: var(--mono); font-size: var(--fs-out); }
.out-tools { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.ausgabe { font-size: var(--fs-out); }
.ausgabe section.variante { border: 1px solid var(--border); border-radius: 10px; padding: 4px 16px 12px; margin-top: 16px; }
.ausgabe section.variante > h3 { margin: 12px 0 6px; font-size: 17px; color: var(--accent); }
.ausgabe h4 { margin: 18px 0 6px; font-size: 16px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.ausgabe h5 { margin: 14px 0 4px; font-size: 15px; }
.ausgabe pre { margin: 4px 0; font-family: var(--mono); font-size: var(--fs-out); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; padding: 2px 0; }
.ausgabe .box { font-family: var(--mono); white-space: pre-wrap; border-radius: 8px; padding: 8px 12px; margin: 8px 0; line-height: 1.5; }
.ausgabe .ergebnis { background: var(--ok-soft); border-left: 4px solid var(--ok); font-weight: 650; }
.ausgabe .warnung { background: var(--warn-soft); border-left: 4px solid var(--warn); }
.ausgabe .fehler { background: var(--err-soft); border-left: 4px solid var(--err); color: var(--err); }
.ausgabe .annahme { background: var(--info-soft); border-left: 4px solid var(--info); font-family: var(--sans); white-space: normal; }
.ausgabe .ok { color: var(--ok); }
.leer { color: var(--muted); padding: 30px 0; text-align: center; }
.lade { color: var(--muted); }

/* Priorisierung (Markdown) */
.md { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 28px 28px; max-width: 1100px; }
.md h1 { font-size: 26px; } .md h2 { font-size: 21px; margin-top: 32px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.md h3 { font-size: 17px; margin-top: 24px; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 9px; vertical-align: top; text-align: left; }
.md th { background: var(--panel-2); position: sticky; top: 0; }
.md tr:nth-child(even) td { background: color-mix(in srgb, var(--panel-2) 45%, transparent); }
.md code { font-family: var(--mono); font-size: .92em; background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
.md pre code { display: block; padding: 10px; overflow-x: auto; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  aside.side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 16px; }
  header.top { flex-wrap: wrap; padding: 10px 16px; position: static; }
  header.top h1 { white-space: normal; width: 100%; }
}
@media print {
  header.top, aside.side, .form-card, .out-tools, .befehl button { display: none !important; }
  .layout { display: block; } .card { box-shadow: none; border: 0; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Diskrete Mathematik <span>· Klausur-Werkzeuge</span></h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="skripte" aria-selected="true">Skripte</button>
    <button role="tab" data-tab="prio" aria-selected="false">Priorisierung</button>
  </nav>
  <div class="spacer"></div>
  <button class="iconbtn" id="kleiner" title="Ausgabe kleiner">A−</button>
  <button class="iconbtn" id="groesser" title="Ausgabe größer">A+</button>
  <button class="iconbtn" id="thema" title="Hell / Dunkel">◐</button>
</header>

<div class="layout" id="ansicht-skripte">
  <aside class="side">
    <input type="search" id="suche" placeholder="Skript suchen …" aria-label="Skript suchen">
    <ol id="liste"></ol>
    <div class="hint">Reihenfolge = Priorität für die Klausur.<br>Strg + Enter startet die Rechnung.</div>
  </aside>
  <main id="haupt"><div class="lade">Lade Skripte …</div></main>
</div>

<div id="ansicht-prio" hidden>
  <main><div class="md" id="prio">Lade …</div></main>
</div>

<script>
"use strict";
// ---------- kleine Hilfen ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const speicher = {
  lesen(k, std) { try { const v = localStorage.getItem(k); return v === null ? std : JSON.parse(v); } catch { return std; } },
  schreiben(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function el(tag, attrs = {}, ...kinder) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kind of kinder.flat()) if (kind !== null && kind !== undefined) e.append(kind);
  return e;
}

// ---------- Thema und Schriftgröße ----------
const wurzel = document.documentElement;
let thema = speicher.lesen("thema", null);
if (thema) wurzel.dataset.theme = thema;
$("#thema").onclick = () => {
  const dunkel = thema ? thema === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  thema = dunkel ? "light" : "dark"; wurzel.dataset.theme = thema; speicher.schreiben("thema", thema);
};
let fs = speicher.lesen("fs", 15);
const setzeFs = () => { wurzel.style.setProperty("--fs-out", fs + "px"); speicher.schreiben("fs", fs); };
setzeFs();
$("#kleiner").onclick = () => { fs = Math.max(11, fs - 1); setzeFs(); };
$("#groesser").onclick = () => { fs = Math.min(24, fs + 1); setzeFs(); };

// ---------- Tabs ----------
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => zeigeTab(b.dataset.tab));
function zeigeTab(tab) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("#ansicht-skripte").hidden = tab !== "skripte";
  $("#ansicht-prio").hidden = tab !== "prio";
  if (tab === "prio") ladePrio();
  speicher.schreiben("tab", tab);
}

// ---------- Daten ----------
let SKRIPTE = [];
let aktuell = null;

fetch("/api/skripte").then(r => r.json()).then(daten => {
  SKRIPTE = daten;
  baueListe();
  const start = location.hash.slice(1) || speicher.lesen("skript", SKRIPTE[0].name);
  waehle(SKRIPTE.find(s => s.name === start) ? start : SKRIPTE[0].name);
  if (speicher.lesen("tab", "skripte") === "prio") zeigeTab("prio");
}).catch(() => { $("#haupt").innerHTML = '<div class="box fehler">Server nicht erreichbar. Läuft <code>python -m skripte.web</code>?</div>'; });

function baueListe() {
  const ol = $("#liste"); ol.innerHTML = "";
  SKRIPTE.forEach((s, i) => ol.append(el("li", {"data-name": s.name, "data-such": (s.titel + " " + s.name + " " + s.beschreibung).toLowerCase()},
    el("button", {onclick: () => waehle(s.name)}, el("span", {class: "nr"}, String(i + 1)), el("span", {}, s.titel)))));
}
$("#suche").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll("#liste li").forEach(li => li.hidden = q && !li.dataset.such.includes(q));
});
window.addEventListener("hashchange", () => { const n = location.hash.slice(1); if (n && n !== aktuell?.name) waehle(n); });

// ---------- Formular aus dem Parser-Schema bauen ----------
function langeOption(f) { return f.optionen.find(o => o.startsWith("--")) || f.optionen[0]; }
function feldName(f) { return f.optionen.length ? langeOption(f) : (Array.isArray(f.metavar) ? f.metavar.join(" ") : (f.metavar || f.dest)); }
function istMehrwertig(n) { return n === "+" || n === "*" || (typeof n === "number" && n > 1); }
function platzhalter(f) {
  if (Array.isArray(f.metavar)) return f.metavar.join(" ");
  if (istMehrwertig(f.nargs)) return (f.metavar || f.dest.toUpperCase()) + " …  (mit Leerzeichen trennen)";
  if (f.standard !== null && f.standard !== undefined && f.standard !== false) return "Standard: " + f.standard;
  return f.metavar || "";
}

function baueFelder(felder, werte, praefix) {
  const box = el("div", {class: "felder"});
  const schalter = [];
  for (const f of felder) {
    const id = praefix + f.dest;
    const w = werte[f.dest];
    const titel = el("label", {class: "name", for: id}, feldName(f),
      f.pflicht ? el("span", {class: "pflicht", title: "Pflichtfeld"}, "*") : null,
      f.optionen.length > 1 ? el("code", {}, f.optionen.filter(o => o !== langeOption(f)).join(", ")) : null);
    const hilfe = f.hilfe ? el("div", {class: "hilfe"}, f.hilfe) : null;
    let eingabe;
    if (f.art === "schalter") {
      eingabe = el("input", {type: "checkbox", id, "data-dest": f.dest, checked: w === true});
      schalter.push(el("div", {class: "feld schalter"}, eingabe, el("div", {}, titel, hilfe)));
      continue;
    } else if (f.art === "auswahl") {
      eingabe = el("select", {id, "data-dest": f.dest},
        f.pflicht ? null : el("option", {value: ""}, f.standard != null ? `Standard (${f.standard})` : "— keine Angabe —"),
        f.auswahl.map(c => el("option", {value: String(c), selected: w === String(c)}, String(c) + (String(c) === String(f.standard) ? "  ·  Standard" : ""))));
    } else if (f.art === "mehrfach") {
      eingabe = el("textarea", {id, "data-dest": f.dest, placeholder: "Eine Angabe pro Zeile" + (f.metavar ? ": " + platzhalter(f) : ""), spellcheck: "false"});
      eingabe.value = w || "";
    } else {
      eingabe = el("input", {type: "text", id, "data-dest": f.dest, placeholder: platzhalter(f), spellcheck: "false", autocomplete: "off"});
      eingabe.value = w || "";
    }
    box.append(el("div", {class: "feld"}, titel, eingabe, hilfe));
  }
  for (const s of schalter) box.append(s);
  return box;
}

function zuArgv(felder, form) {
  const argv = [], pos = [];
  const teile = s => s.trim().split(/\s+/).filter(Boolean);
  for (const f of felder) {
    const e = form.querySelector(`[data-dest="${CSS.escape(f.dest)}"]`);
    if (!e) continue;
    const opt = f.optionen.length ? langeOption(f) : null;
    if (f.art === "schalter") { if (e.checked) argv.push(opt); continue; }
    const v = e.value;
    if (f.art === "mehrfach") {
      for (const zeile of v.split("\n")) {
        if (!zeile.trim()) continue;
        argv.push(opt, ...(f.nargs == null || f.nargs === "?" ? [zeile.trim()] : teile(zeile)));
      }
      continue;
    }
    if (!v.trim()) continue;
    const werte = istMehrwertig(f.nargs) ? teile(v) : [v.trim()];
    if (opt) argv.push(opt, ...werte); else pos.push(...werte);
  }
  return [...pos, ...argv];
}

function sammleWerte(form) {
  const w = {};
  form.querySelectorAll("[data-dest]").forEach(e => { w[e.dataset.dest] = e.type === "checkbox" ? e.checked : e.value; });
  return w;
}

// Beispiele aus dem Hilfetext (epilog) herausziehen: klickbar.
// Die Hilfetexte haben verschiedene Formen, zum Beispiel
//   "  KV A3:   python -m skripte.euklid --a 2406 ...   (Kommentar)"
//   "  --a 12 --k 100 --m 34                 VL3: 12^100 ≡ 30"
//   "  Klausur A2 (…):"  und in der nächsten Zeile der Befehl.
function beispiele(text, name) {
  const out = [];
  const befehlRe = new RegExp("^(.*?)python3?\\s+-m\\s+skripte\\." + name + "\\b(.*)$");
  let label = "";
  for (const roh of String(text).split("\n")) {
    const s = roh.trim();
    if (!s) { label = ""; continue; }
    let vor = "", rest = null;
    const m = s.match(befehlRe);
    if (m) { vor = m[1].trim(); rest = m[2]; }
    else if (/^-{1,2}[a-zA-Z]/.test(s)) rest = s;
    if (rest === null) {
      if (/^\(.*\)$/.test(s) && out.length) out[out.length - 1].kom += (out[out.length - 1].kom ? " " : "") + s.slice(1, -1);
      else if (!/^Beispiel/i.test(s)) label = s.replace(/:$/, "");
      continue;
    }
    const teil = rest.trim().split(/\s{2,}|\s+(?=\()|\s+#\s*/);
    const args = teil[0].trim();
    let kom = [vor.replace(/:$/, ""), teil.slice(1).join(" ").replace(/^\(|\)$/g, "").trim()].filter(Boolean).join(" · ");
    if (!kom && label) kom = label;
    label = "";
    if (args) out.push({args, kom});
  }
  return out;
}

function waehle(name) {
  const s = SKRIPTE.find(x => x.name === name); if (!s) return;
  aktuell = s;
  speicher.schreiben("skript", name);
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  document.querySelectorAll("#liste button").forEach(b => b.removeAttribute("aria-current"));
  $(`#liste li[data-name="${name}"] button`)?.setAttribute("aria-current", "true");

  const gespeichert = speicher.lesen("werte:" + name, {});
  const haupt = $("#haupt"); haupt.innerHTML = "";
  haupt.append(el("div", {class: "titel"},
    el("h2", {}, s.titel), el("div", {class: "modul"}, "python -m skripte." + s.name),
    s.beschreibung ? el("p", {}, s.beschreibung) : null));
  if (s.fehler) { haupt.append(el("div", {class: "ausgabe"}, el("div", {class: "box fehler"}, "Skript konnte nicht geladen werden: " + s.fehler))); return; }

  const form = el("form", {class: "card form-card", onsubmit: e => { e.preventDefault(); rechnen(); }});
  form.append(el("h3", {}, "Eingaben"));
  const felderBox = el("div");
  let subWahl = null;
  const zeigeSub = () => {
    felderBox.innerHTML = "";
    if (!s.unterbefehle) { felderBox.append(baueFelder(s.felder, gespeichert, "f-")); return; }
    const sub = s.unterbefehle.befehle.find(b => b.name === subWahl.value);
    if (sub.hilfe) felderBox.append(el("p", {class: "hilfe", style: "margin:0 0 12px;color:var(--muted)"}, sub.hilfe));
    felderBox.append(baueFelder(sub.felder, gespeichert[sub.name] || {}, "f-" + sub.name + "-"));
  };
  if (s.unterbefehle) {
    subWahl = el("select", {id: "subwahl", onchange: zeigeSub},
      s.unterbefehle.befehle.map(b => el("option", {value: b.name, selected: gespeichert.__sub === b.name}, b.name + " – " + b.hilfe)));
    form.append(el("div", {class: "feld sub-wahl"}, el("label", {class: "name", for: "subwahl"}, "Aufgabentyp"), subWahl));
  }
  form.append(felderBox); zeigeSub();

  const freiEingabe = el("input", {type: "text", id: "frei", spellcheck: "false", autocomplete: "off",
    placeholder: "Optionen wie im Terminal, z. B. " + (beispiele(s.epilog, s.name)[0]?.args || "--help")});
  form.append(el("div", {class: "aktionen"},
    el("button", {class: "btn primary", type: "submit"}, "Rechnen"),
    el("button", {class: "btn", type: "button", onclick: () => { speicher.schreiben("werte:" + name, {}); waehle(name); }}, "Zurücksetzen"),
    el("button", {class: "btn", type: "button", onclick: () => ausfuehren(["--help"])}, "Hilfe anzeigen"),
    el("span", {class: "kbd"}, "Strg + Enter")));

  const bsp = [...beispiele(s.epilog, s.name)];
  if (s.unterbefehle) for (const b of s.unterbefehle.befehle) bsp.push(...beispiele(b.epilog, s.name));
  const det = el("details", {class: "beispiele", open: speicher.lesen("bsp-offen", false)},
    el("summary", {}, `Beispiele aus den Quellen (${bsp.length}) und freie Eingabe`),
    el("div", {class: "bsp-liste"}, bsp.map(b => el("button", {type: "button", class: "bsp", title: "Beispiel ausführen",
      onclick: () => { freiEingabe.value = b.args; rechnenFrei(); }},
      el("code", {}, b.args), b.kom ? el("span", {class: "kom"}, b.kom) : null))),
    el("div", {class: "frei"}, el("span", {}, "skripte." + s.name), freiEingabe,
      el("button", {class: "btn", type: "button", onclick: rechnenFrei}, "Ausführen")));
  det.addEventListener("toggle", () => speicher.schreiben("bsp-offen", det.open));
  freiEingabe.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); rechnenFrei(); } });
  form.append(det);
  haupt.append(form);
  haupt.append(el("div", {class: "card out-card", id: "ausgabe-karte"}, el("div", {class: "leer"}, "Noch keine Rechnung. Eingaben ausfüllen und „Rechnen“ klicken – oder ein Beispiel wählen.")));

  function aktiveFelder() {
    if (!s.unterbefehle) return {felder: s.felder, sub: null};
    const sub = s.unterbefehle.befehle.find(b => b.name === subWahl.value);
    return {felder: sub.felder, sub: sub.name};
  }
  function rechnen() {
    const {felder, sub} = aktiveFelder();
    const werte = sammleWerte(form);
    if (sub) { const alle = speicher.lesen("werte:" + name, {}); alle[sub] = werte; alle.__sub = sub; speicher.schreiben("werte:" + name, alle); }
    else speicher.schreiben("werte:" + name, werte);
    const argv = zuArgv(felder, form);
    ausfuehren(sub ? [sub, ...argv] : argv);
  }
  function rechnenFrei() { ausfuehren(null, freiEingabe.value); }
  form.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); rechnen(); } });
  aktuell.rechnen = rechnen;
}

document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.target.closest?.("form")) aktuell?.rechnen?.(); });

// ---------- Ausführen und Ausgabe darstellen ----------
async function ausfuehren(argv, zeile) {
  const karte = $("#ausgabe-karte");
  karte.innerHTML = '<div class="leer">Rechne …</div>';
  const body = zeile != null ? {skript: aktuell.name, zeile} : {skript: aktuell.name, argv};
  let r;
  try { r = await (await fetch("/api/ausfuehren", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})).json(); }
  catch { karte.innerHTML = '<div class="ausgabe"><div class="box fehler">Server nicht erreichbar.</div></div>'; return; }
  zeigeAusgabe(karte, r);
}

function zeigeAusgabe(karte, r) {
  karte.innerHTML = "";
  const kopieren = (text, knopf) => { navigator.clipboard?.writeText(text).then(() => { const t = knopf.textContent; knopf.textContent = "Kopiert ✓"; setTimeout(() => knopf.textContent = t, 1200); }); };
  const kopf = el("div", {style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px"}, el("h3", {style: "margin:0"}, "Lösungsweg"));
  const tools = el("div", {class: "out-tools"});
  const kb = el("button", {class: "btn", type: "button"}, "Text kopieren"); kb.onclick = () => kopieren(r.stdout, kb);
  tools.append(kb, el("button", {class: "btn", type: "button", onclick: () => print()}, "Drucken"));
  kopf.append(tools); karte.append(kopf);
  if (r.befehl) {
    const bk = el("button", {class: "iconbtn", type: "button", title: "Befehl kopieren"}, "⧉"); bk.onclick = () => kopieren(r.befehl, bk);
    karte.append(el("div", {class: "befehl"}, el("code", {}, r.befehl), bk));
  }
  const ausgabe = el("div", {class: "ausgabe"});
  const ergebnisse = r.stdout.split("\n").filter(z => /^\s*Ergebnis\b/.test(z)).map(z => z.trim());
  if (ergebnisse.length > 1) karte.append(el("div", {class: "zusammenfassung"}, el("h4", {}, "Alle Ergebnisse auf einen Blick"), el("ul", {}, ergebnisse.map(e => el("li", {}, e)))));
  if (r.stdout.trim()) ausgabe.innerHTML = formatiere(r.stdout);
  if (r.stderr.trim()) ausgabe.append(el("div", {class: "box " + (r.code === 0 ? "warnung" : "fehler")}, r.stderr.trim()));
  if (!r.stdout.trim() && !r.stderr.trim()) ausgabe.append(el("div", {class: "leer"}, "Keine Ausgabe."));
  karte.append(ausgabe);
  karte.scrollIntoView({behavior: "smooth", block: "start"});
}

// Wandelt den Text der Skripte in gegliedertes HTML um.
// Regeln: "=== Titel ===" = neuer Block (z. B. Variante); Zeile + Strich-Unterstreichung = Abschnitt;
// "a) …", "1. …", "1) …" am Zeilenanfang = Unterabschnitt; "Ergebnis" / "ACHTUNG" / "Annahme" = Kästen.
function formatiere(text) {
  const z = text.replace(/\s+$/, "").split("\n");
  let html = "", pre = [], offen = false;
  const flush = () => { if (pre.length) { while (pre.length && !pre[pre.length - 1].trim()) pre.pop(); if (pre.length) html += "<pre>" + pre.map(fein).join("\n") + "</pre>"; pre = []; } };
  const fein = s => esc(s).replace(/(✓|stimmt\b)/g, '<span class="ok">$1</span>');
  const warnRe = /^\s*(ACHTUNG|Achtung|WARNUNG|Warnung|Hinweis|HINWEIS|Vorsicht|Fehler in der Quelle|Quelle:|Abweichung)/;
  const fehlerRe = /^\s*(FEHLER|Fehler:|nicht lösbar|Nicht lösbar|unlösbar)/;
  for (let i = 0; i < z.length; i++) {
    const s = z[i], n = z[i + 1] ?? "";
    const m3 = s.match(/^\s*={3,}\s*(.*?)\s*={3,}\s*$/);
    if (m3) { flush(); if (offen) html += "</section>"; html += `<section class="variante"><h3>${esc(m3[1])}</h3>`; offen = true; continue; }
    if (s.trim() && /^\s*[-=─]{3,}\s*$/.test(n) && !s.includes("|") && Math.abs(n.trim().length - s.trim().length) <= 3) { flush(); html += `<h4>${fein(s.trim())}</h4>`; i++; continue; }
    if (/^([a-h]\)|\d{1,2}[.)])\s+\S/.test(s) && s.length < 110 && !/[=≡]/.test(s.slice(0, 6))) { flush(); html += `<h5>${fein(s)}</h5>`; continue; }
    if (/^\s*Ergebnis\b/.test(s)) { flush(); html += `<div class="box ergebnis">${fein(s.trim())}</div>`; continue; }
    if (fehlerRe.test(s)) { flush(); html += `<div class="box fehler">${fein(s.trim())}</div>`; continue; }
    if (warnRe.test(s)) {
      flush(); let block = [s.trim()];
      while (i + 1 < z.length && /^\s{2,}\S/.test(z[i + 1]) && !/^\s*Ergebnis/.test(z[i + 1])) block.push(z[++i].trim());
      html += `<div class="box warnung">${block.map(fein).join("\n")}</div>`; continue;
    }
    if (/^(Annahme|Annahmen|Variante)\b/.test(s)) { flush(); html += `<div class="box annahme">${fein(s)}</div>`; continue; }
    pre.push(s);
  }
  flush(); if (offen) html += "</section>";
  return html;
}

// ---------- Priorisierung: kleines Markdown ----------
let prioGeladen = false;
function ladePrio() {
  if (prioGeladen) return; prioGeladen = true;
  fetch("/api/priorisierung").then(r => r.text()).then(t => { $("#prio").innerHTML = markdown(t); });
}
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
}
function markdown(t) {
  const z = t.split("\n"); let h = "", i = 0;
  while (i < z.length) {
    const s = z[i];
    if (/^```/.test(s)) { const code = []; i++; while (i < z.length && !/^```/.test(z[i])) code.push(z[i++]); i++; h += `<pre><code>${esc(code.join("\n"))}</code></pre>`; continue; }
    const m = s.match(/^(#{1,6})\s+(.*)/); if (m) { h += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^\s*---+\s*$/.test(s)) { h += "<hr>"; i++; continue; }
    if (/^\|/.test(s)) {
      const rows = []; while (i < z.length && /^\|/.test(z[i])) rows.push(z[i++]);
      const zellen = r => r.replace(/^\||\|\s*$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
      const kopf = zellen(rows[0]); const rumpf = rows.slice(/^\|[\s:|-]+\|?\s*$/.test(rows[1] || "") ? 2 : 1);
      h += "<table><thead><tr>" + kopf.map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        rumpf.map(r => "<tr>" + zellen(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(s)) {
      const geordnet = /^\s*\d+\./.test(s); const items = [];
      while (i < z.length && /^\s*([-*]|\d+\.)\s+/.test(z[i])) { let it = z[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""); while (i < z.length && /^\s{2,}\S/.test(z[i]) && !/^\s*([-*]|\d+\.)\s+/.test(z[i])) it += " " + z[i++].trim(); items.push(it); }
      h += (geordnet ? "<ol>" : "<ul>") + items.map(x => `<li>${inline(x)}</li>`).join("") + (geordnet ? "</ol>" : "</ul>"); continue;
    }
    if (!s.trim()) { i++; continue; }
    const p = []; while (i < z.length && z[i].trim() && !/^(#|\||```|\s*([-*]|\d+\.)\s|\s*---+\s*$)/.test(z[i])) p.push(z[i++]);
    h += `<p>${p.map(inline).join("<br>")}</p>`;
  }
  return h;
}
