<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rechenwerkzeuge</title>
<link rel="icon" href="data:,">
<style>
/* Farben als Variablen, hell und dunkel. Keine externen Dateien: läuft ohne Internet. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1c1f24; --muted: #5d6673;
  --border: #dde1e6; --accent: #2f5bd3; --accent-soft: #e6ecfb; --accent-text: #ffffff;
  --ok: #1d7a46; --ok-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fff3dc;
  --err: #b42318; --err-soft: #fdecea; --info: #3d4a5c; --info-soft: #eef1f5;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --fs-out: 15px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --panel-2: #222730; --text: #e6e9ee; --muted: #9aa4b2;
    --border: #2e3440; --accent: #7aa2ff; --accent-soft: #1f2a44; --accent-text: #0d1220;
    --ok: #5fd08f; --ok-soft: #16301f; --warn: #f3b650; --warn-soft: #33270f;
    --err: #ff7b72; --err-soft: #3a1714; --info: #c2cad6; --info-soft: #232a35; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --panel-2: #222730; --text: #e6e9ee; --muted: #9aa4b2;
  --border: #2e3440; --accent: #7aa2ff; --accent-soft: #1f2a44; --accent-text: #0d1220;
  --ok: #5fd08f; --ok-soft: #16301f; --warn: #f3b650; --warn-soft: #33270f;
  --err: #ff7b72; --err-soft: #3a1714; --info: #c2cad6; --info-soft: #232a35; --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }

header.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px;
  padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border); min-height: 53px;
}
header.top h1 { font-size: 17px; margin: 0; font-weight: 650; }
header.top .unter { color: var(--muted); font-size: 13.5px; }
.spacer { flex: 1; }
.iconbtn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.iconbtn:hover { background: var(--panel-2); }

.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 53px); }
aside.side { border-right: 1px solid var(--border); background: var(--panel); padding: 14px 10px; position: sticky; top: 53px; height: calc(100vh - 53px); overflow: auto; }
aside.side input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 6px; }
aside.side h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 10px 4px; font-weight: 650; }
aside.side ul { list-style: none; margin: 0; padding: 0; }
aside.side li button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
aside.side li button:hover { background: var(--panel-2); }
aside.side li button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

main { padding: 24px 28px 60px; max-width: 1180px; width: 100%; }
.titel h2 { margin: 0 0 4px; font-size: 24px; }
.titel .gruppe { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
.titel p { margin: 6px 0 0; color: var(--muted); max-width: 85ch; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.form-card { padding: 18px 20px; margin-top: 18px; }
.form-card h3 { margin: 0 0 12px; font-size: 15px; }
.felder { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px 18px; }
.feld label.name { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.feld .pflicht { color: var(--err); margin-left: 2px; }
.feld input[type=text], .feld select, .feld textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-family: var(--mono); font-size: 14px;
}
.feld textarea { min-height: 64px; resize: vertical; }
.feld input:focus, .feld select:focus, .feld textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.feld.falsch input, .feld.falsch textarea { border-color: var(--err); }
.hilfe { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
details.hilfe summary { cursor: pointer; list-style: none; }
details.hilfe summary::-webkit-details-marker { display: none; }
details.hilfe summary::after { content: " mehr"; color: var(--accent); }
details.hilfe[open] summary::after { content: " weniger"; }
.feld.schalter { display: flex; gap: 10px; align-items: flex-start; }
.feld.schalter input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.feld.schalter label.name { margin: 0; font-weight: 500; }
.sub-wahl { margin-bottom: 16px; max-width: 520px; }

details.block { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
details.block > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text); }
details.block > summary .zusatz { font-weight: 400; color: var(--muted); margin-left: 6px; }
details.block > .inhalt { margin-top: 12px; }

.aktionen { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.klein { padding: 4px 10px; font-size: 13.5px; }
.aktionen .kbd { color: var(--muted); font-size: 12.5px; }
.meldung { margin-top: 12px; }

.bsp-liste { display: flex; flex-wrap: wrap; gap: 8px; }
.bsp { border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; background: var(--bg); cursor: pointer; font-size: 13.5px; text-align: left; }
.bsp:hover { border-color: var(--accent); color: var(--accent); }

/* Ausgabe */
.out-card { margin-top: 18px; padding: 18px 20px; scroll-margin-top: 70px; }
.out-kopf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.out-kopf h3 { margin: 0; font-size: 17px; margin-right: auto; }
.zusammenfassung { margin: 10px 0 6px; border-left: 4px solid var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 10px 14px; }
.zusammenfassung h4 { margin: 0 0 6px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ok); }
.zusammenfassung ul { margin: 0; padding-left: 18px; font-family: var(--mono); font-size: var(--fs-out); }
.ausgabe { font-size: var(--fs-out); }
.ausgabe details { border: 1px solid var(--border); border-radius: 10px; margin-top: 10px; background: var(--panel); }
.ausgabe details > summary { cursor: pointer; padding: 8px 14px; font-weight: 650; list-style: none; display: flex; gap: 8px; align-items: baseline; }
.ausgabe details > summary::-webkit-details-marker { display: none; }
.ausgabe details > summary::before { content: ""; flex: none; width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 7px; border-color: transparent transparent transparent var(--muted); transition: transform .15s; align-self: center; }
.ausgabe details[open] > summary::before { transform: rotate(90deg); }
.ausgabe details > .inhalt { padding: 0 14px 10px; }
.ausgabe details.variante { border-color: var(--accent); }
.ausgabe details.variante > summary { color: var(--accent); font-size: 16.5px; }
.ausgabe details.abschnitt > summary { font-size: 15px; }
.ausgabe details.abschnitt > summary .ergebnis-vorschau { font-family: var(--mono); font-weight: 400; color: var(--ok); font-size: .9em; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.ausgabe details[open] > summary .ergebnis-vorschau { display: none; }
.ausgabe h5 { margin: 12px 0 4px; font-size: 15px; }
.ausgabe pre { margin: 4px 0; font-family: var(--mono); font-size: var(--fs-out); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.ausgabe .box { font-family: var(--mono); white-space: pre-wrap; border-radius: 8px; padding: 8px 12px; margin: 8px 0; line-height: 1.5; }
.ausgabe .ergebnis { background: var(--ok-soft); border-left: 4px solid var(--ok); font-weight: 650; }
.ausgabe .warnung { background: var(--warn-soft); border-left: 4px solid var(--warn); }
.ausgabe .fehler { background: var(--err-soft); border-left: 4px solid var(--err); color: var(--err); font-family: var(--sans); }
.ausgabe .annahme { background: var(--info-soft); border-left: 4px solid var(--info); font-family: var(--sans); white-space: normal; }
.ausgabe .ok { color: var(--ok); }
.leer { color: var(--muted); padding: 30px 0; text-align: center; }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  aside.side { position: static; height: auto; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 16px; }
  header.top { flex-wrap: wrap; padding: 10px 16px; position: static; }
  header.top .unter { display: none; }
}
@media print {
  header.top, aside.side, .form-card, .out-kopf .btn { display: none !important; }
  .layout { display: block; } .card { box-shadow: none; border: 0; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Rechenwerkzeuge</h1>
  <span class="unter">Zahlentheorie · Kryptographie · Codierung · Kombinatorik</span>
  <div class="spacer"></div>
  <button class="iconbtn" id="kleiner" title="Schrift kleiner">A−</button>
  <button class="iconbtn" id="groesser" title="Schrift größer">A+</button>
  <button class="iconbtn" id="thema" title="Hell / Dunkel">◐</button>
</header>

<div class="layout">
  <aside class="side">
    <input type="search" id="suche" placeholder="Werkzeug suchen …" aria-label="Werkzeug suchen">
    <nav id="liste"></nav>
  </aside>
  <main id="haupt"><div class="leer">Lade …</div></main>
</div>

<script>
"use strict";
// ---------- kleine Hilfen ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const speicher = {
  lesen(k, std) { try { const v = localStorage.getItem(k); return v === null ? std : JSON.parse(v); } catch { return std; } },
  schreiben(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function el(tag, attrs = {}, ...kinder) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kind of kinder.flat()) if (kind !== null && kind !== undefined && kind !== false) e.append(kind);
  return e;
}
// Zerlegt eine Befehlszeile wie eine Shell (Anführungszeichen halten Leerzeichen zusammen).
function zerlege(zeile) {
  const out = []; let akt = null, q = null;
  for (const c of zeile) {
    if (q) { if (c === q) q = null; else akt += c; continue; }
    if (c === '"' || c === "'") { q = c; akt = akt ?? ""; continue; }
    if (/\s/.test(c)) { if (akt !== null) { out.push(akt); akt = null; } continue; }
    akt = (akt ?? "") + c;
  }
  if (akt !== null) out.push(akt);
  return out;
}

// ---------- Darstellung: Thema und Schriftgröße ----------
const wurzel = document.documentElement;
let thema = speicher.lesen("thema", null);
if (thema) wurzel.dataset.theme = thema;
$("#thema").onclick = () => {
  const dunkel = thema ? thema === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  thema = dunkel ? "light" : "dark"; wurzel.dataset.theme = thema; speicher.schreiben("thema", thema);
};
let fs = speicher.lesen("fs", 15);
const setzeFs = () => { wurzel.style.setProperty("--fs-out", fs + "px"); speicher.schreiben("fs", fs); };
setzeFs();
$("#kleiner").onclick = () => { fs = Math.max(11, fs - 1); setzeFs(); };
$("#groesser").onclick = () => { fs = Math.min(24, fs + 1); setzeFs(); };

// ---------- Daten laden ----------
let WERKZEUGE = [];
let aktuell = null;

fetch("/api/skripte").then(r => r.json()).then(daten => {
  WERKZEUGE = daten;
  baueListe();
  const start = location.hash.slice(1) || speicher.lesen("werkzeug", WERKZEUGE[0].name);
  waehle(WERKZEUGE.some(s => s.name === start) ? start : WERKZEUGE[0].name);
}).catch(() => { $("#haupt").innerHTML = '<div class="leer">Der Server ist nicht erreichbar. Bitte die Anwendung neu starten.</div>'; });

function baueListe() {
  const nav = $("#liste"); nav.innerHTML = "";
  const gruppen = [...new Set(WERKZEUGE.map(s => s.gruppe))];
  for (const g of gruppen) {
    const ul = el("ul");
    for (const s of WERKZEUGE.filter(x => x.gruppe === g))
      ul.append(el("li", {"data-name": s.name, "data-such": (s.titel + " " + s.beschreibung + " " + g).toLowerCase()},
        el("button", {onclick: () => waehle(s.name)}, s.titel)));
    nav.append(el("div", {class: "gruppe"}, el("h2", {}, g), ul));
  }
}
$("#suche").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();
  $$("#liste li").forEach(li => li.hidden = q && !li.dataset.such.includes(q));
  $$("#liste .gruppe").forEach(g => g.hidden = !$$("li", g).some(li => !li.hidden));
});
window.addEventListener("hashchange", () => { const n = location.hash.slice(1); if (n && n !== aktuell?.name) waehle(n); });

// ---------- Beschriftungen ----------
function langeOption(f) { return f.optionen.find(o => o.startsWith("--")) || f.optionen[0]; }
function beschriftung(f) {
  let n = f.optionen.length ? langeOption(f).replace(/^-+/, "") : (Array.isArray(f.metavar) ? f.metavar.join(" ") : (f.metavar || f.dest));
  if (n.length <= 2) return n;                       // Formelzeichen wie p, q, e, m bleiben klein
  n = n.replace(/[-_]/g, " ").replace(/ae/g, "ä").replace(/oe/g, "ö").replace(/ue/g, "ü");
  return n.charAt(0).toUpperCase() + n.slice(1);
}
const istMehrwertig = n => n === "+" || n === "*" || (typeof n === "number" && n > 1);
function platzhalter(f) {
  if (Array.isArray(f.metavar)) return f.metavar.join(" ");
  if (istMehrwertig(f.nargs)) return "Werte mit Leerzeichen trennen";
  if (f.standard !== null && f.standard !== undefined && f.standard !== false) return "Standard: " + f.standard;
  return "";
}
// Texte der Werkzeuge für die Seite anpassen: "--p" wird zum Feldnamen „p“, "Skript" zu "Werkzeug".
let AKTIVE_FELDER = [];
function lesbar(text, felder = AKTIVE_FELDER) {
  return String(text)
    .replace(/(^|[\s(„"'])(--?[a-zA-Z][\w-]*)(?:[ =]([a-z][\w-]*))?/g, (m, vor, opt, wert) => {
      const f = felder.find(x => x.optionen.includes(opt));
      if (!f) return m;
      if (wert && f.auswahl && f.auswahl.map(String).includes(wert)) return `${vor}„${beschriftung(f)}: ${wert}“`;
      return `${vor}„${beschriftung(f)}“` + (wert ? " " + wert : "");
    })
    .replace(/\bSkripts\b/g, "Werkzeugs").replace(/\bSkript\b/g, "Werkzeug").replace(/\bSkripte\b/g, "Werkzeuge");
}
// Lange Hilfetexte: erster Satz sichtbar, Rest klappbar.
function hilfeText(text) {
  if (!text) return null;
  const t = lesbar(text.trim());
  const m = t.match(/^(.{20,140}?[.!?:])\s+(.+)$/s);
  if (t.length <= 120 || !m) return el("div", {class: "hilfe"}, t);
  return el("details", {class: "hilfe"}, el("summary", {}, m[1]), el("div", {}, m[2]));
}

// ---------- Formular aus dem Parser-Schema bauen ----------
function feldElement(f, w, praefix) {
  const id = praefix + f.dest;
  const titel = el("label", {class: "name", for: id}, beschriftung(f), f.pflicht ? el("span", {class: "pflicht", title: "Pflichtfeld"}, "*") : null);
  if (f.art === "schalter") {
    const cb = el("input", {type: "checkbox", id, "data-dest": f.dest, checked: w === true});
    return el("div", {class: "feld schalter"}, cb, el("div", {}, titel, hilfeText(f.hilfe)));
  }
  let eingabe;
  if (f.art === "auswahl") {
    eingabe = el("select", {id, "data-dest": f.dest},
      f.pflicht ? null : el("option", {value: ""}, f.standard != null ? `${f.standard} (Standard)` : "— keine Angabe —"),
      f.auswahl.filter(c => f.pflicht || String(c) !== String(f.standard)).map(c => el("option", {value: String(c), selected: w === String(c)}, String(c))));
  } else if (f.art === "mehrfach") {
    eingabe = el("textarea", {id, "data-dest": f.dest, spellcheck: "false",
      placeholder: "Eine Angabe pro Zeile" + (Array.isArray(f.metavar) ? " (" + f.metavar.join(" ") + ")" : "")});
    eingabe.value = w || "";
  } else {
    eingabe = el("input", {type: "text", id, "data-dest": f.dest, placeholder: platzhalter(f), spellcheck: "false", autocomplete: "off"});
    eingabe.value = w || "";
  }
  return el("div", {class: "feld"}, titel, eingabe, hilfeText(f.hilfe));
}

function baueFelder(felder, werte, praefix) {
  const eingaben = felder.filter(f => f.art === "wert" || f.art === "mehrfach" || (f.art === "auswahl" && f.pflicht));
  const optionen = felder.filter(f => !eingaben.includes(f));
  const box = el("div");
  if (eingaben.length) box.append(el("div", {class: "felder"}, eingaben.map(f => feldElement(f, werte[f.dest], praefix))));
  if (optionen.length) {
    const geaendert = optionen.filter(f => werte[f.dest] && werte[f.dest] !== "").length;
    const det = el("details", {class: "block", open: geaendert > 0},
      el("summary", {}, "Varianten und Optionen", el("span", {class: "zusatz"}, geaendert ? `(${geaendert} geändert)` : "(Standard)")),
      el("div", {class: "inhalt felder"}, optionen.filter(f => f.art !== "schalter").map(f => feldElement(f, werte[f.dest], praefix)),
        optionen.filter(f => f.art === "schalter").map(f => feldElement(f, werte[f.dest], praefix))));
    box.append(det);
  }
  return box;
}

function zuArgv(felder, form) {
  const argv = [], pos = [];
  const teile = s => s.trim().split(/\s+/).filter(Boolean);
  for (const f of felder) {
    const e = form.querySelector(`[data-dest="${CSS.escape(f.dest)}"]`);
    if (!e) continue;
    const opt = f.optionen.length ? langeOption(f) : null;
    if (f.art === "schalter") { if (e.checked) argv.push(opt); continue; }
    const v = e.value;
    if (f.art === "mehrfach") {
      for (const zeile of v.split("\n")) if (zeile.trim())
        argv.push(opt, ...(f.nargs == null || f.nargs === "?" ? [zeile.trim()] : teile(zeile)));
      continue;
    }
    if (!v.trim()) continue;
    const werte = istMehrwertig(f.nargs) ? teile(v) : [v.trim()];
    if (opt) argv.push(opt, ...werte); else pos.push(...werte);
  }
  return [...pos, ...argv];
}

// Umgekehrt: Beispiel-Befehl in die Formularfelder eintragen.
function argvZuWerten(tokens, felder) {
  const werte = {}; const pos = felder.filter(f => !f.optionen.length); let pi = 0;
  const finde = t => felder.find(f => f.optionen.includes(t));
  const istOption = t => /^--?[a-zA-Z]/.test(t) && !!finde(t);
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i], f = finde(t);
    if (f) {
      if (f.art === "schalter") { werte[f.dest] = true; continue; }
      const vals = []; while (i + 1 < tokens.length && !istOption(tokens[i + 1])) { vals.push(tokens[++i]); if (!istMehrwertig(f.nargs)) break; }
      if (f.art === "mehrfach") werte[f.dest] = (werte[f.dest] ? werte[f.dest] + "\n" : "") + vals.join(" ");
      else werte[f.dest] = vals.join(" ");
    } else if (pi < pos.length) {
      const p = pos[pi];
      if (istMehrwertig(p.nargs)) { const vals = [t]; while (i + 1 < tokens.length && !istOption(tokens[i + 1])) vals.push(tokens[++i]); werte[p.dest] = vals.join(" "); }
      else werte[p.dest] = t;
      pi++;
    }
  }
  return werte;
}

function sammleWerte(form) {
  const w = {};
  $$("[data-dest]", form).forEach(e => { w[e.dataset.dest] = e.type === "checkbox" ? e.checked : e.value; });
  return w;
}

// Beispiele aus dem Hilfetext (epilog): "python -m skripte.x ARGS   (Erklärung)"
function beispiele(text, name) {
  const out = [];
  const re = new RegExp("python3?\\s+-m\\s+skripte\\." + name + "\\b(.*)$");
  let label = "";
  for (const roh of String(text).split("\n")) {
    const s = roh.trim();
    if (!s) { label = ""; continue; }
    const m = s.match(re);
    let rest = m ? m[1] : (/^-{1,2}[a-zA-Z]/.test(s) ? s : null);
    const vor = m ? s.slice(0, m.index).trim().replace(/:$/, "") : "";
    if (rest === null) {
      if (/^\(.*\)$/.test(s) && out.length && !out[out.length - 1].kom) out[out.length - 1].kom = s.slice(1, -1);
      else if (!/^Beispiel/i.test(s)) label = s.replace(/:$/, "");
      continue;
    }
    const teil = rest.trim().split(/\s{2,}|\s+(?=\()|\s+#\s*/);
    const args = teil[0].trim();
    const kom = teil.slice(1).join(" ").replace(/^\(|\)$/g, "").trim() || vor || label;
    label = "";
    if (args) out.push({args, kom});
  }
  return out;
}

// argparse-Fehler (englisch) in verständliche Meldungen übersetzen.
function uebersetzeFehler(stderr, felder) {
  const zeile = (stderr.match(/error: (.*)/) || [])[1];
  if (!zeile) return stderr.trim();
  const name = opt => { const f = felder.find(x => x.optionen.includes(opt) || x.dest === opt || x.metavar === opt); return f ? "„" + beschriftung(f) + "“" : opt; };
  let m;
  if ((m = zeile.match(/the following arguments are required: (.*)/))) return "Bitte ausfüllen: " + m[1].split(/,\s*/).map(o => name(o.split("/")[0])).join(", ");
  if ((m = zeile.match(/argument ([^:]+): invalid (\w+) value: '(.*)'/))) return `${name(m[1].split("/")[0])}: „${m[3]}“ ist keine gültige ${m[2] === "int" ? "ganze Zahl" : "Eingabe"}.`;
  if ((m = zeile.match(/argument ([^:]+): expected (.*)/))) return `${name(m[1].split("/")[0])}: Die Anzahl der Werte passt nicht.`;
  if ((m = zeile.match(/argument ([^:]+): not allowed with argument (.*)/))) return `${name(m[1].split("/")[0])} und ${name(m[2].split("/")[0])} gehen nicht zusammen.`;
  if ((m = zeile.match(/argument ([^:]+): invalid choice: '(.*)'/))) return `${name(m[1].split("/")[0])}: „${m[2]}“ ist nicht erlaubt.`;
  return zeile;
}

// ---------- Werkzeug anzeigen ----------
function waehle(name) {
  const s = WERKZEUGE.find(x => x.name === name); if (!s) return;
  aktuell = s;
  speicher.schreiben("werkzeug", name);
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  $$("#liste button").forEach(b => b.removeAttribute("aria-current"));
  $(`#liste li[data-name="${name}"] button`)?.setAttribute("aria-current", "true");

  const gespeichert = speicher.lesen("werte:" + name, {});
  const haupt = $("#haupt"); haupt.innerHTML = "";
  const besch = lesbar((s.beschreibung || "").trim(), s.felder);
  const erster = (besch.match(/^.*?[.!?](\s|$)/) || [besch])[0].trim();
  const rest = besch.slice(erster.length).trim();
  haupt.append(el("div", {class: "titel"},
    el("div", {class: "gruppe"}, s.gruppe), el("h2", {}, s.titel),
    erster ? el("p", {}, erster) : null,
    rest ? el("details", {class: "hilfe", style: "margin-top:4px;max-width:85ch"}, el("summary", {}, "Mehr zu diesem Werkzeug"), el("div", {style: "font-size:14px"}, rest)) : null));
  if (s.fehler) { haupt.append(el("div", {class: "card out-card"}, el("div", {class: "ausgabe"}, el("div", {class: "box fehler"}, "Das Werkzeug konnte nicht geladen werden: " + s.fehler)))); return; }

  const form = el("form", {class: "card form-card", novalidate: true, onsubmit: e => { e.preventDefault(); rechnen(); }});
  const felderBox = el("div");
  let subWahl = null;
  const aktiv = () => {
    if (!s.unterbefehle) return {felder: s.felder, sub: null, epilog: s.epilog};
    const sub = s.unterbefehle.befehle.find(b => b.name === subWahl.value);
    return {felder: sub.felder, sub: sub.name, epilog: sub.epilog};
  };
  const zeigeFelder = (werte) => {
    felderBox.innerHTML = "";
    const {felder, sub} = aktiv();
    AKTIVE_FELDER = felder;
    const w = werte ?? (sub ? (gespeichert[sub] || {}) : gespeichert);
    felderBox.append(el("h3", {}, "Eingaben"));
    felderBox.append(baueFelder(felder, w, "f-" + (sub || "") + "-"));
    zeigeBeispiele();
  };
  if (s.unterbefehle) {
    subWahl = el("select", {id: "subwahl", onchange: () => zeigeFelder()},
      s.unterbefehle.befehle.map(b => el("option", {value: b.name, selected: gespeichert.__sub === b.name}, b.hilfe.replace(/\.$/, "") || b.name)));
    form.append(el("div", {class: "feld sub-wahl"}, el("label", {class: "name", for: "subwahl"}, "Was möchten Sie berechnen?"), subWahl));
  }
  form.append(felderBox);

  const bspBox = el("div", {class: "inhalt"});
  const bspDet = el("details", {class: "block", open: speicher.lesen("bsp-offen", true)}, el("summary", {}, "Beispiele", el("span", {class: "zusatz"}, "Klick füllt die Felder und rechnet")), bspBox);
  bspDet.addEventListener("toggle", () => speicher.schreiben("bsp-offen", bspDet.open));
  function zeigeBeispiele() {
    bspBox.innerHTML = "";
    const {sub, epilog} = aktiv();
    let liste = beispiele(epilog, s.name);
    if (sub) liste = liste.map(b => ({...b, args: b.args.replace(new RegExp("^" + sub + "\\s+"), "")}));
    bspDet.hidden = !liste.length;
    bspBox.append(el("div", {class: "bsp-liste"}, liste.map(b => el("button", {type: "button", class: "bsp", title: b.kom || "Beispiel",
      onclick: () => { zeigeFelder(argvZuWerten(zerlege(b.args), aktiv().felder)); rechnen(); }}, b.kom || b.args))));
  }

  const meldung = el("div", {class: "meldung"});
  form.append(el("div", {class: "aktionen"},
    el("button", {class: "btn primary", type: "submit"}, "Rechnen"),
    el("button", {class: "btn", type: "button", onclick: () => { speicher.schreiben("werte:" + name, {}); waehle(name); }}, "Felder leeren"),
    el("span", {class: "kbd"}, "oder Strg + Enter")), meldung, bspDet);
  zeigeFelder();
  haupt.append(form);
  const karte = el("div", {class: "card out-card", id: "ausgabe-karte"}, el("div", {class: "leer"}, "Zahlen eingeben und „Rechnen“ klicken – oder ein Beispiel wählen."));
  haupt.append(karte);

  function rechnen() {
    const {felder, sub} = aktiv();
    // Pflichtfelder prüfen, bevor gerechnet wird.
    const fehlend = felder.filter(f => f.pflicht && f.art !== "schalter" && !form.querySelector(`[data-dest="${CSS.escape(f.dest)}"]`)?.value.trim());
    $$(".feld", form).forEach(x => x.classList.remove("falsch"));
    if (fehlend.length) {
      fehlend.forEach(f => form.querySelector(`[data-dest="${CSS.escape(f.dest)}"]`)?.closest(".feld")?.classList.add("falsch"));
      meldung.innerHTML = ""; meldung.append(el("div", {class: "ausgabe"}, el("div", {class: "box fehler"}, "Bitte ausfüllen: " + fehlend.map(beschriftung).join(", "))));
      return;
    }
    meldung.innerHTML = "";
    const werte = sammleWerte(form);
    if (sub) { const alle = speicher.lesen("werte:" + name, {}); alle[sub] = werte; alle.__sub = sub; speicher.schreiben("werte:" + name, alle); }
    else speicher.schreiben("werte:" + name, werte);
    const argv = zuArgv(felder, form);
    ausfuehren(sub ? [sub, ...argv] : argv, felder);
  }
  form.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); rechnen(); } });
  aktuell.rechnen = rechnen;
}
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.target.closest?.("form")) aktuell?.rechnen?.(); });

// ---------- Rechnen und Ausgabe darstellen ----------
async function ausfuehren(argv, felder) {
  const karte = $("#ausgabe-karte");
  karte.innerHTML = '<div class="leer">Rechne …</div>';
  let r;
  try { r = await (await fetch("/api/ausfuehren", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({skript: aktuell.name, argv})})).json(); }
  catch { karte.innerHTML = '<div class="ausgabe"><div class="box fehler">Der Server ist nicht erreichbar.</div></div>'; return; }
  zeigeAusgabe(karte, r, felder);
}

function zeigeAusgabe(karte, r, felder) {
  karte.innerHTML = "";
  const kopieren = (text, knopf) => { navigator.clipboard?.writeText(text).then(() => { const t = knopf.textContent; knopf.textContent = "Kopiert ✓"; setTimeout(() => knopf.textContent = t, 1200); }); };
  const ausgabe = el("div", {class: "ausgabe"});
  const kb = el("button", {class: "btn klein", type: "button"}, "Text kopieren"); kb.onclick = () => kopieren(r.stdout, kb);
  karte.append(el("div", {class: "out-kopf"}, el("h3", {}, "Lösungsweg"),
    el("button", {class: "btn klein", type: "button", onclick: () => $$("details", ausgabe).forEach(d => d.open = true)}, "Alles aufklappen"),
    el("button", {class: "btn klein", type: "button", onclick: () => $$("details", ausgabe).forEach(d => d.open = false)}, "Alles zuklappen"),
    kb, el("button", {class: "btn klein", type: "button", onclick: () => { $$("details", ausgabe).forEach(d => d.open = true); print(); }}, "Drucken")));
  const ergebnisse = r.stdout.split("\n").filter(z => /^\s*Ergebnis\b/.test(z)).map(z => z.trim());
  if (ergebnisse.length) karte.append(el("div", {class: "zusammenfassung"}, el("h4", {}, ergebnisse.length > 1 ? "Ergebnisse auf einen Blick" : "Ergebnis"),
    el("ul", {}, ergebnisse.map(e => el("li", {}, e.replace(/^Ergebnis\s*/, "").replace(/^([a-z]\))?\s*:\s*/, (m, t) => t ? t + " " : ""))))));
  if (r.stdout.trim()) {
    ausgabe.innerHTML = formatiere(r.stdout, felder);
    // Das erste Ergebnis eines Abschnitts steht auch in dessen Kopfzeile (sichtbar, wenn zugeklappt).
    $$("details.abschnitt", ausgabe).forEach(d => { const e = $(".box.ergebnis", d); if (e) $(".ergebnis-vorschau", d).textContent = e.textContent; });
  }
  if (r.stderr.trim()) ausgabe.append(el("div", {class: "box " + (r.code === 0 ? "warnung" : "fehler")}, r.code === 0 ? r.stderr.trim() : uebersetzeFehler(r.stderr, felder)));
  if (!r.stdout.trim() && !r.stderr.trim()) ausgabe.append(el("div", {class: "leer"}, "Keine Ausgabe."));
  karte.append(ausgabe);
  karte.scrollIntoView({behavior: "smooth", block: "start"});
}

// Wandelt den Text der Werkzeuge in klappbares HTML um.
//   "=== Titel ==="                    → klappbarer Block (z. B. eine Variante)
//   Zeile + Strich-Unterstreichung    → klappbarer Abschnitt
//   "a) …", "1. …", "1) …"           → Zwischenüberschrift
//   "Ergebnis" / "ACHTUNG" / "Annahme" → farbige Kästen
function formatiere(text, felder) {
  const z = lesbar(text.replace(/\s+$/, ""), felder || AKTIVE_FELDER).split("\n");
  let html = "", pre = [], varOffen = false, absOffen = false;
  const fein = s => esc(s).replace(/(✓|\bstimmt\b)/g, '<span class="ok">$1</span>');
  const flush = () => { while (pre.length && !pre[pre.length - 1].trim()) pre.pop(); while (pre.length && !pre[0].trim()) pre.shift(); if (pre.length) html += "<pre>" + pre.map(fein).join("\n") + "</pre>"; pre = []; };
  const schliesseAbs = () => { flush(); if (absOffen) { html += "</div></details>"; absOffen = false; } };
  const schliesseVar = () => { schliesseAbs(); if (varOffen) { html += "</div></details>"; varOffen = false; } };
  const warnRe = /^\s*(ACHTUNG|Achtung|WARNUNG|Warnung|Hinweis|HINWEIS|Vorsicht|Abweichung)/;
  const fehlerRe = /^\s*(FEHLER|Fehler:|nicht lösbar|Nicht lösbar|unlösbar)/;
  for (let i = 0; i < z.length; i++) {
    const s = z[i], n = z[i + 1] ?? "";
    const m3 = s.match(/^\s*={3,}\s*(.*?)\s*={3,}\s*$/);
    if (m3) { schliesseVar(); html += `<details class="variante" open><summary>${esc(m3[1])}</summary><div class="inhalt">`; varOffen = true; continue; }
    if (s.trim() && /^\s*[-=─]{3,}\s*$/.test(n) && !s.includes("|") && Math.abs(n.trim().length - s.trim().length) <= 3) {
      schliesseAbs(); html += `<details class="abschnitt" open><summary>${fein(s.trim())}<span class="ergebnis-vorschau"></span></summary><div class="inhalt">`; absOffen = true; i++; continue;
    }
    if (/^([a-h]\)|\d{1,2}[.)])\s+\S/.test(s) && s.length < 110 && !/[=≡]/.test(s.slice(0, 6))) { flush(); html += `<h5>${fein(s)}</h5>`; continue; }
    if (/^\s*Ergebnis\b/.test(s)) {
      flush(); html += `<div class="box ergebnis">${fein(s.trim())}</div>`;
      continue;
    }
    if (fehlerRe.test(s)) { flush(); html += `<div class="box fehler">${fein(s.trim())}</div>`; continue; }
    if (warnRe.test(s)) {
      flush(); const block = [s.trim()];
      while (i + 1 < z.length && /^\s{2,}\S/.test(z[i + 1]) && !/^\s*Ergebnis/.test(z[i + 1])) block.push(z[++i].trim());
      html += `<div class="box warnung">${block.map(fein).join("\n")}</div>`; continue;
    }
    if (/^(Annahme|Annahmen|Variante)\b/.test(s)) { flush(); html += `<div class="box annahme">${fein(s)}</div>`; continue; }
    pre.push(s);
  }
  schliesseVar();
  return html;
}
